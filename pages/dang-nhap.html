<script>
        // Tab switching logic
        function switchTab(tabId) {
            const loginForm = document.getElementById('form-login');
            const registerForm = document.getElementById('form-register');
            const tabLoginBtn = document.getElementById('tab-login');
            const tabRegisterBtn = document.getElementById('tab-register');

            if (tabId === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                
                tabLoginBtn.classList.add('text-primary', 'dark:text-secondary-fixed-dim', 'border-primary', 'dark:border-secondary-fixed-dim');
                tabLoginBtn.classList.remove('text-on-surface-variant', 'dark:text-surface-dim', 'border-transparent');
                
                tabRegisterBtn.classList.remove('text-primary', 'dark:text-secondary-fixed-dim', 'border-primary', 'dark:border-secondary-fixed-dim');
                tabRegisterBtn.classList.add('text-on-surface-variant', 'dark:text-surface-dim', 'border-transparent');
            } else {
                registerForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                
                tabRegisterBtn.classList.add('text-primary', 'dark:text-secondary-fixed-dim', 'border-primary', 'dark:border-secondary-fixed-dim');
                tabRegisterBtn.classList.remove('text-on-surface-variant', 'dark:text-surface-dim', 'border-transparent');
                
                tabLoginBtn.classList.remove('text-primary', 'dark:text-secondary-fixed-dim', 'border-primary', 'dark:border-secondary-fixed-dim');
                tabLoginBtn.classList.add('text-on-surface-variant', 'dark:text-surface-dim', 'border-transparent');
            }
        }

        // Dark mode toggle logic
        const themeToggleBtn = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;
        
        themeToggleBtn.addEventListener('click', () => {
            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark');
                themeToggleBtn.querySelector('span').setAttribute('data-icon', 'dark_mode');
                themeToggleBtn.querySelector('span').textContent = 'dark_mode';
            } else {
                htmlElement.classList.add('dark');
                themeToggleBtn.querySelector('span').setAttribute('data-icon', 'light_mode');
                themeToggleBtn.querySelector('span').textContent = 'light_mode';
            }
        });
        
        // Initialize Material Icons span content based on data-icon
        document.addEventListener('DOMContentLoaded', () => {
            const icons = document.querySelectorAll('[data-icon]');
            icons.forEach(icon => {
                icon.textContent = icon.getAttribute('data-icon');
                icon.classList.add('material-symbols-outlined');
            });
        });
    </script>
